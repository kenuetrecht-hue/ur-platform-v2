# Local MySQL for UR Platform (matches DATABASE_URL in .env.example)
services:
  mysql:
    image: mysql:8.4
    container_name: ur-mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: ur_platform
    ports:
      - "3306:3306"
    volumes:
      - ur_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  ur_mysql_data:
